name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify Jin Ping Mei playable model
        working-directory: examples/jin-ping-mei/build/app
        run: npm run verify:model
      - name: Test Journey to the West systems
        working-directory: examples/journey-to-the-west/build/app
        run: npm test
      - name: Install Project Plateau dependencies
        working-directory: examples/project-plateau/build/app
        run: npm ci
      - name: Test and build Project Plateau
        working-directory: examples/project-plateau/build/app
        run: npm test && npm run build
