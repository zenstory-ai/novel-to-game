name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
