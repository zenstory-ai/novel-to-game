name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      # Publication contracts verify that recorded source/evidence commit IDs
      # exist and reproduce the promoted build fingerprint. A shallow checkout
      # cannot inspect those earlier commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Install audio inspection tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Install Project Plateau dependencies
        working-directory: examples/project-plateau/build/app
        run: npm ci
      - name: Test and build Project Plateau
        working-directory: examples/project-plateau/build/app
        run: npm test && npm run build
      - name: Install browser controller test runtime
        run: |
          python3 -m pip install pillow==12.2.0 playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Verify Project Plateau controller contract
        working-directory: examples/project-plateau/build/app
        run: python3 test/qa_controller.py && python3 test/qa_motion.py
      - name: Run TTS safety and audio tests
        working-directory: examples/project-plateau/build/media/remotion
        run: npm run test:tts
