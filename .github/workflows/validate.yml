name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Test Journey to the West systems and design contract
        working-directory: examples/journey-to-the-west/build/app
        run: npm test
      - name: Install Project Plateau dependencies
        working-directory: examples/project-plateau/build/app
        run: npm ci
      - name: Test and build Project Plateau
        working-directory: examples/project-plateau/build/app
        run: npm test && npm run build
