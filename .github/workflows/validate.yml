name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Install audio inspection tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run TTS safety and audio tests
        working-directory: examples/project-plateau/build/media/remotion
        run: npm run test:tts
